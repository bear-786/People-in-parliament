<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายชื่อคนในสภา</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8 text-slate-800">🏛️ รายชื่อสมาชิกสภาจำลอง</h1>
        
        <div id="loader" class="text-center py-10">กำลังดึงข้อมูล...</div>

        <div id="list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        // *** วาง Connection URL จาก Sheet.best ตรงนี้ ***
        const API_URL = 'https://api.sheetbest.com/sheets/14632631-5680-46a9-87e9-c053d7999335';

        async function getMembers() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const container = document.getElementById('list-container');
                document.getElementById('loader').classList.add('hidden');

container.innerHTML = data.map(person => {
    const imageUrl = person['รูปภาพ (URL)'] || 'https://via.placeholder.com/400';

    return `
        <div class="bg-white rounded-3xl shadow-lg border border-gray-100 overflow-hidden hover:shadow-2xl transition-all duration-500 mb-6 group">
            <div class="w-full bg-gray-50 flex items-center justify-center p-0">
                <img src="${imageUrl}" 
                     alt="${person['ชื่อ-นาสกุล สมุมติ']}" 
                     class="w-full h-auto object-contain transition-transform duration-500 group-hover:scale-105"
                     onerror="this.src='https://via.placeholder.com/400x500?text=ไม่มีรูปภาพ'">
            </div>
            
            <div class="p-8 text-center bg-white relative">
                <div class="inline-block bg-blue-600 text-white text-[10px] font-bold px-4 py-1.5 rounded-full mb-4 shadow-sm uppercase tracking-widest">
                    ${person['ตำแหน่งในสภา.']}
                </div>
                <h2 class="text-2xl font-bold text-gray-900 mb-2">
                    ${person['ชื่อ-นาสกุล สมุมติ']}
                </h2>
                <div class="flex items-center justify-center gap-2 text-gray-400">
                    <span class="h-px w-8 bg-gray-200"></span>
                    <p class="text-sm font-mono uppercase">ID: ${person['รายชื่อ']}</p>
                    <span class="h-px w-8 bg-gray-200"></span>
                </div>
            </div>
        </div>
    `;
}).join('');


            } catch (error) {
                document.getElementById('loader').innerText = '❌ โหลดข้อมูลไม่สำเร็จ ตรวจสอบ URL อีกครั้ง';
            }
        }

        getMembers();
    </script>
</body>
</html>
