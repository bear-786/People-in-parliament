<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายชื่อคนในสภา</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8 text-slate-800">🏛️ รายชื่อสมาชิกสภา</h1>
        
        <div id="loader" class="text-center py-10">กำลังดึงข้อมูล...</div>

        <div id="list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        // *** วาง Connection URL จาก Sheet.best ตรงนี้ ***
        const API_URL = 'https://api.sheetbest.com/sheets/14632631-5680-46a9-87e9-c053d7999335';

        async function getMembers() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const container = document.getElementById('list-container');
                document.getElementById('loader').classList.add('hidden');

container.innerHTML = data.map(person => {
    // ดึง URL รูปภาพจากคอลัมน์ "รูปภาพ (URL)" 
    // หากช่องนั้นว่าง ระบบจะใช้รูปเงาคน (Placeholder) แทน
    const imageUrl = person['รูปภาพ (URL)'] || 'https://www.w3schools.com/howto/img_avatar.png';

    return `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg transition-all duration-300 mb-4">
            <div class="h-64 bg-slate-200 overflow-hidden">
                <img src="${imageUrl}" 
                     alt="${person['ชื่อ-นาสกุล สมุมติ']}" 
                     class="w-full h-full object-cover shadow-inner"
                     onerror="this.src='https://via.placeholder.com/300x400?text=Image+Error'">
            </div>
            
            <div class="p-6 text-center">
                <div class="inline-block bg-blue-50 text-blue-600 text-[10px] font-bold px-3 py-1 rounded-full mb-3 uppercase tracking-wider">
                    ${person['ตำแหน่งในสภา.']}
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-1">
                    ${person['ชื่อ-นาสกุล สมุมติ']}
                </h2>
                <p class="text-sm text-gray-400 font-mono italic">
                    ชื่อโรบอก : ${person['รายชื่อ']}
                </p>
            </div>
        </div>
    `;
}).join('');

            } catch (error) {
                document.getElementById('loader').innerText = '❌ โหลดข้อมูลไม่สำเร็จ ตรวจสอบ URL อีกครั้ง';
            }
        }

        getMembers(p-2);
    </script>
</body>
</html>
